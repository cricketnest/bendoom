<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Play Hangar, the first level of DOOM, running in Bend 2.">
<meta name="theme-color" content="#2f2821">
<title>Bendoom</title>
<style>
  :root {
    --px: 3px;
    --red: #d8261c;
    --gold: #e8c048;
    color-scheme: dark;
    font: 14px/1.6 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color: #cbb89a;
    background: #2f2821 var(--floor, none) 0 0 / calc(64 * var(--px));
    image-rendering: pixelated;
  }
  @media (max-width: 720px) { :root { --px: 2px; } }
  body {
    box-sizing: border-box;
    min-height: 100vh;
    margin: 0;
    padding: 40px max(16px, 50% - 480px) 48px;
    background: radial-gradient(ellipse at 50% 35%, #0000 25%, #000c 95%), linear-gradient(#0000 55%, #5a0a0470);
  }
  img { display: block; width: calc(var(--w) * var(--px)); max-width: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; margin-bottom: 24px; }
  h1 { --px: 8px; margin: 0; font: 900 56px/1 Impact, "Arial Black", sans-serif; color: var(--red); text-transform: uppercase; filter: drop-shadow(0 6px 0 #1c0000); }
  header p { max-width: 42ch; margin: 0; text-align: right; }
  a { color: var(--gold); white-space: nowrap; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  a:hover { color: #fff; }
  button, a { outline-offset: 4px; }
  :focus-visible { outline: 2px solid var(--gold); }
  .bevel { border: calc(3 * var(--px)) solid #1a1510; border-image: var(--bevel, none) 3 repeat; }
  #screen { position: relative; aspect-ratio: 4 / 3; background: #000; box-shadow: 0 16px 48px #000; }
  #screen > :not(#sound) { position: absolute; inset: 0; width: 100%; height: 100%; }
  #title { pointer-events: none; }
  #cover { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 12px; padding: 32px; background: linear-gradient(#0000 50%, #000d); }
  button { padding: 0; background: none; border: 0; color: var(--red); font: inherit; text-transform: uppercase; cursor: pointer; }
  #play { display: flex; align-items: center; gap: calc(8 * var(--px)); font: 900 40px/1 Impact, "Arial Black", sans-serif; }
  #play:enabled::before { content: ""; width: calc(20 * var(--px)); height: calc(19 * var(--px)); background: var(--skull1, none) 0 0 / 100%; animation: skull .46s step-end infinite; }
  @keyframes skull { 50% { background-image: var(--skull2, none); } }
  #play:disabled { opacity: .4; cursor: wait; }
  #status { margin: 0; color: var(--gold); text-transform: uppercase; letter-spacing: .12em; text-shadow: 0 2px 0 #000; }
  #sound { position: absolute; top: calc(4 * var(--px)); left: calc(4 * var(--px)); }
  .level { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0; --px: 2px; }
  .level > :first-child { --px: 4px; }
  #keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 24px; margin: 0; padding: 20px 24px; background: #000b; }
  #keys div { display: flex; align-items: center; gap: 12px; }
  dt { display: flex; gap: 4px; }
  dd { margin: 0; text-transform: uppercase; letter-spacing: .08em; }
  kbd { min-width: 1.4em; padding: 1px 6px; text-align: center; font: 700 12px/1.6 inherit; color: #eee; background: #585858; border: 2px solid; border-color: #9a9a9a #262626 #262626 #9a9a9a; }
  footer { margin-top: 24px; color: #8d7b62; font-size: 12px; text-align: center; text-transform: uppercase; letter-spacing: .08em; }
  [hidden] { display: none !important; }
</style>
<header>
  <h1 data-art>Bendoom</h1>
  <p>DOOM's first level, written in Bend 2 and compiled to WebAssembly. <a href="https://github.com/eliesgalvira/bendoom">Source & downloads</a></p>
</header>
<main>
  <div id="screen" class="bevel">
    <canvas id="bend" tabindex="0" aria-label="Bendoom game"></canvas>
    <canvas id="title" width="320" height="200" aria-hidden="true"></canvas>
    <div id="cover">
      <button id="play" disabled><span data-art="M_NGAME">New game</span></button>
      <p id="status" role="status">Loading game…</p>
    </div>
    <button id="sound" hidden><span data-art>Click to enable sound</span></button>
  </div>
  <p class="level"><span data-art>E1M1: Hangar</span><span data-art="M_HURT">Hurt me plenty.</span></p>
  <dl id="keys" class="bevel">
    <div><dt><kbd>W</kbd><kbd>S</kbd></dt><dd>Walk</dd></div>
    <div><dt><kbd>A</kbd><kbd>D</kbd></dt><dd>Strafe</dd></div>
    <div><dt><kbd>←</kbd><kbd>→</kbd></dt><dd>Turn</dd></div>
    <div><dt><kbd>Shift</kbd></dt><dd>Run</dd></div>
    <div><dt><kbd>F</kbd></dt><dd>Fire</dd></div>
    <div><dt><kbd>Space</kbd></dt><dd>Use · respawn</dd></div>
    <div><dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></dt><dd>Weapons</dd></div>
    <div><dt><kbd>Esc</kbd></dt><dd>Quit</dd></div>
  </dl>
</main>
<footer>Original shareware DOOM. Keyboard required.</footer>
<script>
  const play = document.getElementById('play');
  const cover = document.getElementById('cover');
  const status = document.getElementById('status');
  const sound = document.getElementById('sound');
  const canvas = document.getElementById('bend');
  const title = document.getElementById('title');
  const controls = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowLeft', 'ArrowRight',
    'ArrowUp', 'ArrowDown', 'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight',
    'Space', 'Digit1', 'Digit2', 'Digit3', 'Escape']);
  const held = new Map();
  let playing = false;
  function fail(error) {
    console.error(error);
    playing = false;
    cover.hidden = false;
    status.textContent = "Couldn't start the game. Try a current desktop browser, or use the download above.";
    play.disabled = false;
    play.textContent = 'Reload';
    play.onclick = () => location.reload();
  }
  function blank(width, height) {
    return Object.assign(document.createElement('canvas'), { width, height });
  }
  // Paints the page with the IWAD's own art: the view border, title screen, menu and HUD font.
  function dress() {
    const wad = Module.FS.readFile('/doom1.wad');
    const view = new DataView(wad.buffer);
    const lumps = new Map();
    for (let i = 0, at = view.getInt32(8, true); i < view.getInt32(4, true); i++, at += 16) {
      const start = view.getInt32(at, true);
      lumps.set(new TextDecoder().decode(wad.subarray(at + 8, at + 16)).replace(/\0.*/s, ''),
        wad.subarray(start, start + view.getInt32(at + 4, true)));
    }
    const palette = lumps.get('PLAYPAL');
    function image(width, height, fill) {
      const art = blank(width, height), context = art.getContext('2d');
      const pixels = context.createImageData(width, height);
      fill((x, y, index) => pixels.data.set([...palette.subarray(3 * index, 3 * index + 3), 255], 4 * (y * width + x)));
      context.putImageData(pixels, 0, 0);
      return art;
    }
    function patch(name) {
      const lump = lumps.get(name), header = new DataView(lump.buffer, lump.byteOffset);
      const width = header.getUint16(0, true);
      return image(width, header.getUint16(2, true), put => {
        for (let x = 0; x < width; x++)
          for (let at = header.getUint32(8 + 4 * x, true); lump[at] !== 255; at += lump[at + 1] + 4)
            for (let i = 0; i < lump[at + 1]; i++) put(x, lump[at] + i, lump[at + 3 + i]);
      });
    }
    function text(string) {
      const glyphs = [...string.toUpperCase()].map(c => 'STCFN' + String(c.charCodeAt(0)).padStart(3, '0'))
        .map(name => lumps.has(name) ? patch(name) : blank(4, 1));
      const line = blank(glyphs.reduce((width, glyph) => width + glyph.width, 0), 8);
      glyphs.reduce((x, glyph) => (line.getContext('2d').drawImage(glyph, x, 0), x + glyph.width), 0);
      return line;
    }
    const floor = image(64, 64, put => lumps.get('FLOOR7_2').forEach((index, i) => put(i % 64, i >> 6, index)));
    const bevel = blank(14, 14);
    for (const [edge, x, y] of [['T', 3, 0], ['B', 3, 11], ['L', 0, 3], ['R', 11, 3],
      ['TL', 0, 0], ['TR', 11, 0], ['BL', 0, 11], ['BR', 11, 11]])
      bevel.getContext('2d').drawImage(patch('BRDR_' + edge), x, y);
    const style = document.documentElement.style;
    for (const [property, art] of [['--floor', floor], ['--bevel', bevel],
      ['--skull1', patch('M_SKULL1')], ['--skull2', patch('M_SKULL2')]])
      style.setProperty(property, `url(${art.toDataURL()})`);
    title.getContext('2d').drawImage(patch('TITLEPIC'), 0, 0);
    for (const element of document.querySelectorAll('[data-art]')) {
      const art = element.dataset.art ? patch(element.dataset.art) : text(element.textContent);
      const picture = Object.assign(new Image(), { src: art.toDataURL(), alt: element.textContent });
      picture.style.setProperty('--w', art.width);
      element.replaceChildren(picture);
    }
  }
  // Vanilla's screen melt: 2-pixel columns fall at 35 Hz from staggered starts.
  function melt() {
    const from = blank(320, 200), context = title.getContext('2d');
    from.getContext('2d').drawImage(title, 0, 0);
    const y = [-Math.floor(Math.random() * 16)];
    for (let i = 1; i < 160; i++) y[i] = Math.min(0, Math.max(-15, y[i - 1] + Math.floor(Math.random() * 3) - 1));
    const tick = setInterval(() => {
      context.clearRect(0, 0, 320, 200);
      for (let i = 0; i < 160; i++) {
        y[i] = Math.min(200, y[i] + (y[i] < 0 ? 1 : y[i] < 16 ? y[i] + 1 : 8));
        const top = Math.max(0, y[i]);
        context.drawImage(from, 2 * i, 0, 2, 200 - top, 2 * i, top, 2, 200 - top);
      }
      if (y.every(row => row === 200)) { clearInterval(tick); title.hidden = true; }
    }, 1000 / 35);
  }
  var Module = {
    noInitialRun: true,
    arguments: ['--threads', '1'],
    preRun: [() => Object.assign(Module.ENV, {
      BENDOOM_IWAD: '/doom1.wad', BENDOOM_MUSIC: '/music', BENDOOM_SOUNDS: '/sounds'
    })],
    setStatus(text) {
      const [, loaded, total] = text.match(/\((\d+)\/(\d+)\)/) || [];
      if (total) status.textContent = `Loading WAD… ${Math.floor(100 * loaded / total)}%`;
    },
    onRuntimeInitialized() {
      status.textContent = 'Press Enter';
      play.disabled = false;
      setTimeout(dress);
    },
    onAbort: fail,
    print: console.log,
    printErr: console.error,
    onExit(code) {
      if (code !== 0) { fail('Game exited with code ' + code); return; }
      playing = false;
      cover.hidden = false;
      status.textContent = 'Game closed.';
      play.textContent = 'Play again';
      play.onclick = () => location.reload();
    }
  };
  play.onclick = () => {
    playing = true;
    cover.hidden = true;
    canvas.focus();
    Module.callMain(Module.arguments);
    melt();
  };
  sound.onclick = () => {
    for (const device of Module.bendAudio?.values() || []) device.context.resume().catch(fail);
  };
  setInterval(() => {
    sound.hidden = !playing || ![...(Module.bendAudio?.values() || [])]
      .some(device => device.context.state === 'suspended');
  }, 250);
  for (const type of ['keydown', 'keyup']) window.addEventListener(type, event => {
    if (playing && event.code === 'KeyF') {
      event.preventDefault();
      event.stopImmediatePropagation();
      window.dispatchEvent(new KeyboardEvent(type, {code: 'ControlLeft', key: 'Control'}));
    }
  }, true);
  window.addEventListener('keydown', event => {
    if (!playing && event.key === 'Enter' && !play.disabled) {
      event.preventDefault();
      play.click();
    } else if (playing && controls.has(event.code)) {
      event.preventDefault();
      held.set(event.code, event.key);
    }
  });
  window.addEventListener('keyup', event => held.delete(event.code));
  window.addEventListener('blur', () => {
    for (const [code, key] of held) window.dispatchEvent(new KeyboardEvent('keyup', {code, key}));
    held.clear();
  });
  if (!crossOriginIsolated) {
    fail('The page needs cross-origin isolation to start its workers.');
  } else {
    const script = document.createElement('script');
    script.src = 'game.js';
    script.onerror = fail;
    document.body.append(script);
  }
</script>
</html>
